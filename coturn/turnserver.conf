# ==============================================================================
# Coturn TURN/STUN Server Configuration for ChatFlow
# Designed for high-reliability WebRTC relay across restrictive firewalls & NATs.
# ==============================================================================

# Standard STUN/TURN UDP and TCP listening port
listening-port=3478

# Secure TURNS (TLS) listening port
tls-listening-port=5349

# Listen on all available network interfaces
listening-ip=0.0.0.0

# Min and max UDP relay ports for RTP traffic
min-port=49152
max-port=65535

# Realm domain (must match or identify your service)
realm=chatflow.example

# Enable Coturn REST API authentication with static shared secret
use-auth-secret
static-auth-secret=c8f2b740e53a94821d37b6c590e8a1f4b3e7d2c19a8b6f4e2d0c8b6a4e2f0d8

# Enforce WebRTC fingerprinting & anti-replay protection
fingerprint
stale-nonce=600

# Connection limits and quotas
total-quota=200
bps-capacity=0

# Security hardening: disable multicast and insecure telnet/cli
no-multicast-peers
no-cli

# Logging
verbose
log-file=stdout
