<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>ChatFlow</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#121b22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatFlow" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        overflow: hidden;
        touch-action: pan-x pan-y !important;
        -webkit-touch-callout: none !important;
        -webkit-text-size-adjust: 100% !important;
        overscroll-behavior: none !important;
        user-select: none !important;
        -webkit-user-select: none !important;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        overflow: hidden;
      }
      input,
      textarea {
        user-select: text !important;
        -webkit-user-select: text !important;
        font-size: 16px !important;
        touch-action: manipulation !important;
      }
      button {
        touch-action: manipulation !important;
      }
      @media print {
        html, body, #root, * {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
