name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Production Backend URL'
        required: false
        default: 'https://chatflow-backend.onrender.com'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build ChatFlow Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: ⚙️ Configure Production Mobile Build Environment
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          TARGET_URL="${BACKEND_URL}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://chatflow-backend.onrender.com"
          fi
          if [[ ! "$TARGET_URL" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "backend_url must be an http(s) origin without a path"
            exit 1
          fi
          echo "Setting mobile build environment to production: $TARGET_URL"
          touch apps/mobile/.env
          grep -v '^EXPO_PUBLIC_API_URL=' apps/mobile/.env | grep -v '^EXPO_PUBLIC_SOCKET_URL=' > apps/mobile/.env.tmp || true
          mv apps/mobile/.env.tmp apps/mobile/.env
          echo "EXPO_PUBLIC_API_URL=$TARGET_URL" >> apps/mobile/.env
          echo "EXPO_PUBLIC_SOCKET_URL=$TARGET_URL" >> apps/mobile/.env
          if [ -n "$EXPO_PROJECT_ID" ]; then
            echo "EXPO_PUBLIC_EAS_PROJECT_ID=$EXPO_PROJECT_ID" >> apps/mobile/.env
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/mobile/google-services.json
          fi

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔨 Build Shared Workspace
        run: pnpm --filter @chatflow/shared build

      - name: 🚀 Prebuild Native Android Project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🛠️ Grant execute permission for Gradle wrapper
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: 📱 Assemble Android APK (Direct Install)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🏷️ Prepare APK artifact
        run: |
          mkdir -p build-output
          find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/ChatFlow.apk \;
          ls -la build-output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatFlow-Android-APK
          path: build-output/ChatFlow.apk
          retention-days: 30

      - name: 🌟 Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/ChatFlow.apk
          name: ChatFlow Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
