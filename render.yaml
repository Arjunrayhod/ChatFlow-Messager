services:
  - type: web
    name: chatflow-backend
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @chatflow/shared build && pnpm --filter @chatflow/server build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: TURN_HOST
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_UDP_PORT
        value: "3478"
      - key: TURN_TCP_PORT
        value: "3478"
      - key: TURN_TTL_SECONDS
        value: "3600"
